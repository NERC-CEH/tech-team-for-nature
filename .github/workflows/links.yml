name: Check links

# Every Monday (and when started by hand): check every link in the website's pages. Broken ones are
# listed in an issue titled "Broken links on the website", so someone can fix them.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Pages and guides; not the built site. Links behind UKCEH logins or that refuse robots are skipped.
          args: >-
            --no-progress --max-concurrency 8 --timeout 30 --retry-wait-time 5 --max-retries 2
            --accept 200,204,206,301,302,403,429
            --exclude "connect-apps\.ceh\.ac\.uk" --exclude "sharepoint\.com" --exclude "drive\.google\.com"
            --exclude "linkedin\.com" --exclude "twitter\.com|x\.com" --exclude "^mailto:"
            --exclude-path "_site" --exclude-path "templates"
            "./**/*.qmd" "./**/*.md"
          output: lychee/out.md
          fail: false
      - name: Open or update an issue if anything is broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links on the website
          content-filepath: lychee/out.md
          labels: links
