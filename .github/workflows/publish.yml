# Builds the website and publishes it on GitHub Pages whenever main changes (including when the
# approval app publishes a story), every Monday (to pick up changes to the toolkit's guides), or by hand.
name: Publish website

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copy the latest partner guides from the toolkit
        run: python tools/sync_howtos.py
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
      - name: Build
        run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
